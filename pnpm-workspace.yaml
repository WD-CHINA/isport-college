packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild

overrides:
  glob@^10.0.0: 10.5.0
  # Nuxt 的 SSR 样式提取与 antdv-next 1.7.0 必须共用同一个样式上下文。
  '@antdv-next/nuxt@1.1.0>@antdv-next/cssinjs': 1.1.0

# nuxt-define 1.0.0 的运行时代码使用 @nuxt/kit，但发布清单仅声明为开发依赖。
packageExtensions:
  nuxt-define@1.0.0:
    dependencies:
      '@nuxt/kit': 4.5.2
